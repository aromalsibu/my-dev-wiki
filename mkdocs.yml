site_name: My Wiki
site_url: https://github.com/aromalsibu/my-dev-wiki
theme:
  name: material

  palette:

    # Light mode
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.top


  copyright: ""  

extra_css:
  - stylesheet/extra.css

markdown_extensions:
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: false
  - pymdownx.superfences
  - pymdownx.inlinehilite

